name: gateadapt

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/gateadapt.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/gateadapt.yml"

jobs:
  test:
    # the package declares >=3.10, so every supported version runs the suite;
    # Windows and macOS run it too (the ledger lock, paths and console
    # encoding all differ there)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      # -X warn_default_encoding + error: any open() relying on the platform
      # encoding fails here, on every OS, before it bites a Windows user
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples

  dogfood:
    # the library's own CI: run the bundled toy admissions through the real
    # CLI — deterministic, free, no secrets. Exercises the exact pattern the
    # README prescribes for users' own harness repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[dev]"

      - name: Quickstart from the installed package (gateadapt init)
        run: |
          cd "$(mktemp -d)"
          gateadapt --version
          gateadapt init
          set +e
          gateadapt admit examples/mutations/refusal_contract.yaml \
            --config examples/config.yaml --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl --run examples/toy_agent.py:run
          rc=$?
          if [ $rc -ne 3 ]; then echo "::error::quickstart should abstain (exit 3), got $rc"; exit 1; fi

      - name: Helpful mutation commits via synthesis reserve (exit 0)
        run: |
          gateadapt admit examples/mutations/refusal_contract.yaml \
            --config examples/config.yaml \
            --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl \
            --reserve examples/tasks_reserve.jsonl \
            --run examples/toy_agent.py:run

      - name: Harmful mutation rejects (exit 1 must fail the job)
        run: |
          if gateadapt admit examples/mutations/always_answer.yaml \
            --config examples/config.yaml \
            --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl \
            --run examples/toy_agent.py:run; then
            echo "::error::expected reject (exit 1), got success"
            exit 1
          fi

      - name: Underpowered mutation abstains (exit 3, unknown is not passed)
        run: |
          set +e
          gateadapt admit examples/mutations/topk_boost.yaml \
            --config examples/config.yaml \
            --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl \
            --run examples/toy_agent.py:run
          rc=$?
          if [ $rc -ne 3 ]; then echo "::error::expected abstain (exit 3), got $rc"; exit 1; fi
