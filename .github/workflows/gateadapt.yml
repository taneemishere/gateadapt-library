name: gateadapt

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/gateadapt.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/gateadapt.yml"

jobs:
  dogfood:
    # the library's own CI: run the bundled toy admissions through the real
    # CLI — deterministic, free, no secrets. Exercises the exact pattern the
    # README prescribes for users' own harness repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[dev]"

      - name: Test suite
        run: python -m pytest tests/ -x -q

      - name: Helpful mutation commits (exit 0)
        run: |
          gateadapt admit examples/mutations/refusal_contract.yaml \
            --config examples/config.yaml \
            --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl \
            --run examples/toy_agent.py:run

      - name: Harmful mutation rejects (exit 1 must fail the job)
        run: |
          if gateadapt admit examples/mutations/always_answer.yaml \
            --config examples/config.yaml \
            --tasks examples/tasks_dev.jsonl \
            --probe examples/tasks_probe.jsonl \
            --run examples/toy_agent.py:run; then
            echo "::error::expected reject (exit 1), got success"
            exit 1
          fi
