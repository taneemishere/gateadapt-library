name: release

# Publishes to PyPI via OIDC trusted publishing — no stored API token.
# Fires when a GitHub Release is published; the release tag must match
# pyproject.toml's version or the job fails before uploading anything.

on:
  release:
    types: [published]

permissions:
  id-token: write   # required for PyPI trusted publishing (OIDC)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - run: python -m pytest tests/ -x -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gateadapt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Check tag matches pyproject version
        run: |
          v="v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          [ "$v" = "${{ github.ref_name }}" ] || {
            echo "tag ${{ github.ref_name }} != pyproject version $v"
            exit 1
          }

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
