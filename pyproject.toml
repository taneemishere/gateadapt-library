[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateadapt"
version = "0.4.0"
description = "CI for agent changes: measurement-gated admission of harness mutations (COMMIT / REJECT / ABSTAIN)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gateadapt = "gateadapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateadapt = ["data/*.json", "py.typed"]
