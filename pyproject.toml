[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gateadapt"
version = "0.6.0"
description = "CI for agent changes. Measurement-gated admission of harness mutations (COMMIT / REJECT / ABSTAIN)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "taneemishere", email = "taneemishere@gmail.com" }]
keywords = ["agents", "llm", "evaluation", "ci", "ab-testing", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/taneemishere/gateadapt-library"
Repository = "https://github.com/taneemishere/gateadapt-library"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gateadapt = "gateadapt.cli:main"

[tool.setuptools]
# examples/ stays the single source in the repo; the build maps it into the
# wheel so `gateadapt init` can copy it out after a plain pip install
packages = ["gateadapt", "gateadapt.data", "gateadapt._examples", "gateadapt._examples.mutations"]

[tool.setuptools.package-dir]
"" = "src"
"gateadapt._examples" = "examples"
"gateadapt._examples.mutations" = "examples/mutations"

[tool.setuptools.package-data]
gateadapt = ["data/*.json", "py.typed"]
"gateadapt._examples" = ["*.yaml", "*.jsonl"]
"gateadapt._examples.mutations" = ["*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# long lines are left to review, and UP038 is deprecated upstream
ignore = ["E501", "UP038"]
