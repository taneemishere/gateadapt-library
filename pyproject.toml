[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gateadapt"
version = "0.4.0"
description = "CI for agent changes. Measurement-gated admission of harness mutations (COMMIT / REJECT / ABSTAIN)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "taneemishere", email = "taneemishere@gmail.com" }]
keywords = ["agents", "llm", "evaluation", "ci", "ab-testing", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/taneemishere/gateadapt-library"
Repository = "https://github.com/taneemishere/gateadapt-library"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gateadapt = "gateadapt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateadapt = ["data/*.json", "py.typed"]
